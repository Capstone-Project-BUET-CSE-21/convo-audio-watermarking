spring.application.name=audio-watermark
server.port=${PORT:8081}

management.endpoints.web.exposure.include=health

# Database
spring.datasource.url=${spring-datasource-url}
spring.datasource.username=${spring-datasource-username}
spring.datasource.password=${spring-datasource-password}
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Required settings below have no fallback value, but an EMPTY default (the
# trailing ':') on purpose. With no default at all, Spring binds an unset
# variable as the literal text "${VAR}", which passes the "must be set"
# checks. Empty makes them fail at startup instead.

# Verifies the login JWTs convo-backend issues (see JwtProperties). Must match
# convo-backend's own JWT_SECRET exactly.
app.jwt.secret=${JWT_SECRET:}

# Server-to-server call to convo-backend's internal API (MeetingParticipantClient).
# See InternalServiceProperties. service-key must match convo-backend's own
# app.internal.service-key exactly.
app.internal.service-key=${INTERNAL_SERVICE_KEY:}
app.internal.backend-base-url=${CONVO_BACKEND_URL:}