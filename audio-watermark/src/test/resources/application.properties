spring.datasource.url=jdbc:h2:mem:audio_watermark_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# InternalServiceProperties fails startup without this.
app.internal.service-key=test-internal-service-key
app.internal.backend-base-url=http://localhost:8080
